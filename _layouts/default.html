<!doctype html>
<html lang="{{ site.locale | slice: 0,2 | default: 'en' }}">
<head>{% include desk/head.html %}</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="desk">
    {% include desk/sidebar.html %}
    <main id="main" class="desk-main" tabindex="-1">
      {{ content }}
      <footer class="page-footer"><span>{{ site.author.name }} · {{ site.author.employer }}</span><a href="mailto:{{ site.author.email }}">Get in touch <span aria-hidden="true">↗</span></a></footer>
    </main>
  </div>
  {% if jekyll.environment == 'production' %}{% include analytics.html %}{% endif %}
</body>
</html>
