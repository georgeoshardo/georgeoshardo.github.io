<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mask Array Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ffffff;
        --paper: #ffffff;
        --paper-strong: #ffffff;
        --paper-shadow: #d9d9d9;
        --ink: #111111;
        --ink-soft: rgba(17, 17, 17, 0.66);
        --viewer-bg: #ffffff;
        --viewer-surface: #ffffff;
        --viewer-line: rgba(17, 17, 17, 0.14);
        --line: rgba(17, 17, 17, 0.14);
        --accent: #111111;
        --accent-soft: rgba(17, 17, 17, 0.08);
        --metal: #111111;
        --warn: #8a1f1f;
        --shadow: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        position: relative;
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background: var(--bg);
        font-family: "IBM Plex Mono", monospace;
      }

      body::before {
        content: none;
      }

      a {
        color: var(--accent);
      }

      .shell {
        position: relative;
        width: min(1400px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(320px, 400px) minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }

      .panel {
        position: relative;
      }

      .sidebar {
        padding: 22px;
        display: grid;
        gap: 20px;
        position: sticky;
        top: 20px;
        background: transparent;
      }

      .section {
        display: grid;
        gap: 14px;
      }

      .section + .section {
        padding-top: 18px;
        border-top: 1px solid rgba(31, 23, 19, 0.12);
      }

      .section h2 {
        margin: 0;
        font-family: "Bodoni Moda", serif;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink);
      }

      .section p {
        margin: 0;
        color: var(--ink-soft);
        line-height: 1.55;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      input[type="text"],
      input[type="number"] {
        width: 100%;
        border: 0;
        border-bottom: 1px solid rgba(31, 23, 19, 0.28);
        border-radius: 0;
        padding: 12px 0;
        font: inherit;
        color: var(--ink);
        background: transparent;
        box-shadow: none;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 22px;
        background: transparent;
      }

      button {
        border: 1px solid rgba(31, 23, 19, 0.18);
        border-radius: 0;
        padding: 12px 16px;
        font: inherit;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--paper-strong);
        background: #111111;
        box-shadow: none;
        cursor: pointer;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease;
      }

      button.secondary {
        color: var(--ink);
        background: transparent;
        border: 1px solid rgba(31, 23, 19, 0.2);
      }

      button:hover {
        transform: translateY(-1px);
        border-color: rgba(17, 17, 17, 0.55);
        box-shadow: none;
      }

      button:disabled {
        opacity: 0.55;
        cursor: progress;
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .row > * {
        flex: 1 1 140px;
      }

      .status {
        padding: 12px 0 0;
        border-radius: 0;
        background: transparent;
        border: 0;
        border-top: 1px solid rgba(31, 23, 19, 0.14);
        color: var(--ink-soft);
        min-height: 52px;
        line-height: 1.45;
        box-shadow: none;
      }

      .status.error {
        color: var(--warn);
        border-color: rgba(161, 63, 39, 0.24);
      }

      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .chip {
        padding: 8px 10px;
        border-radius: 0;
        background: transparent;
        border: 1px solid rgba(31, 23, 19, 0.12);
        color: var(--ink-soft);
        font-size: 0.76rem;
        letter-spacing: 0.05em;
      }

      .control-list {
        display: grid;
        gap: 12px;
      }

      .control-card {
        display: grid;
        gap: 10px;
        padding: 10px 0 0;
        border-radius: 0;
        background: transparent;
        border: 0;
        border-top: 1px solid rgba(31, 23, 19, 0.12);
        box-shadow: none;
      }

      .control-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
      }

      .control-head strong {
        font-family: "Bodoni Moda", serif;
        font-size: 1.08rem;
        font-weight: 700;
      }

      .control-head span,
      .control-meta {
        color: var(--ink-soft);
        font-size: 0.82rem;
      }

      .viewer {
        display: grid;
        gap: 14px;
        padding: 20px;
        background: transparent;
        border-left: 1px solid rgba(17, 17, 17, 0.12);
      }

      .viewer-main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 24px;
        align-items: start;
      }

      .axes-panel {
        display: grid;
        gap: 14px;
        align-content: start;
      }

      .viewer-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      .viewer-top p {
        margin: 0;
        color: var(--ink-soft);
      }

      #view-summary {
        font-family: "Bodoni Moda", serif;
        font-size: clamp(1rem, 1.5vw, 1.25rem);
        letter-spacing: 0.02em;
      }

      .viewer-stage {
        border-radius: 0;
        border: 0;
        background:
          linear-gradient(rgba(17, 17, 17, 0.06) 1px, transparent 1px) 0 0 / 100% 28px,
          linear-gradient(90deg, rgba(17, 17, 17, 0.06) 1px, transparent 1px) 0 0 / 28px 100%,
          #ffffff;
        min-height: 70vh;
        overflow: auto;
        padding: 18px;
        box-shadow: none;
      }

      .canvas-wrap {
        width: 100%;
        min-height: calc(70vh - 36px);
        display: flex;
        justify-content: center;
        align-items: start;
      }

      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: transparent;
        border-radius: 0;
        border: 0;
        box-shadow: none;
      }

      .hover {
        margin: 0;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.9rem;
        color: var(--ink-soft);
        min-height: 1.2em;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        height: 2px;
        background: linear-gradient(90deg, rgba(17, 17, 17, 0.22), rgba(17, 17, 17, 0.64));
      }

      input[type="range"]::-moz-range-track {
        height: 2px;
        background: linear-gradient(90deg, rgba(17, 17, 17, 0.22), rgba(17, 17, 17, 0.64));
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        margin-top: -6px;
        border-radius: 50%;
        border: 2px solid #ffffff;
        background: var(--accent);
        box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.08);
      }

      input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid #ffffff;
        background: var(--accent);
        box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.08);
      }

      @media (max-width: 1080px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }

        .viewer {
          border-left: 0;
          border-top: 1px solid rgba(17, 17, 17, 0.12);
        }

        .viewer-main {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100vw - 18px, 1400px);
          padding-top: 14px;
        }

        .viewer,
        .sidebar {
          padding: 14px;
        }

        .viewer-stage {
          min-height: 60vh;
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="layout">
        <aside class="panel sidebar">
          <section class="section">
            <h2>Dataset</h2>
            <label for="mask-source-input">
              Mask zarr URL
              <input id="mask-source-input" type="text" spellcheck="false" />
            </label>
            <label for="image-source-input">
              Image zarr URL
              <input id="image-source-input" type="text" spellcheck="false" />
            </label>
            <div class="row">
              <button id="load-button" type="button">Load Array</button>
              <button id="copy-link-button" class="secondary" type="button">Copy View Link</button>
            </div>
            <div id="status" class="status" aria-live="polite">Loading metadata...</div>
          </section>

          <section class="section">
            <h2>Display</h2>
            <label for="zoom-range">
              Zoom
              <div class="row">
                <input id="zoom-range" type="range" min="1" max="18" step="1" value="4" />
                <input id="zoom-number" type="number" min="1" max="18" step="1" value="4" />
              </div>
            </label>
            <label for="mask-alpha-range">
              Mask alpha
              <div class="row">
                <input id="mask-alpha-range" type="range" min="0" max="1" step="0.05" value="0.45" />
                <input id="mask-alpha-number" type="number" min="0" max="1" step="0.05" value="0.45" />
              </div>
            </label>
          </section>
        </aside>

        <section class="panel viewer">
          <div class="viewer-top">
            <div>
              <p id="view-summary">Preparing viewer...</p>
            </div>
            <p class="hover" id="hover-readout"></p>
          </div>
          <div class="viewer-main">
            <div class="viewer-stage" id="viewer-stage">
              <div class="canvas-wrap">
                <canvas id="mask-canvas" width="34" height="164" aria-label="Mask viewer"></canvas>
              </div>
            </div>
            <aside class="axes-panel">
              <section class="section">
                <h2>Axes</h2>
                <div id="controls" class="control-list"></div>
              </section>
            </aside>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="/assets/js/zarr-mask-viewer.js"></script>
  </body>
</html>
