<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% include seo.html %}
{% unless page.excerpt %}<meta name="description" content="{{ page.description | default: site.description | escape }}">{% endunless %}
<meta name="theme-color" content="#f7edc8">
<link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon-180x180.png' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="preload" href="{{ '/assets/fonts/eb-garamond/eb-garamond-400.ttf' | relative_url }}" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/desk.css' | relative_url }}">
{% if page.mathjax %}<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>{% endif %}
